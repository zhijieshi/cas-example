<!DOCTYPE html>
<html>
<body>
    {% if user %}
        <h2>Welcome, {{ user }}!</h2>
        <p>Your NetID is authenticated via UConn CAS.</p>
        <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
        <h2>You are not logged in.</h2>
        <a href="{{ url_for('login') }}">Login with UConn CAS</a>
    {% endif %}
</body>
</html>
